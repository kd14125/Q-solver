name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Cache Go Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: ${{ runner.os }}-go-tools-wails-v1

      - name: Install Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          Write-Host "Installing Wails..."
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        run: |
          Write-Host "🔨 Starting Wails Build..."
          wails build -ldflags "-s -w" -tags prod

      - name: Prepare Artifact
        run: |
          $ExePath = "build\bin\Q-Solver.exe"
          if (Test-Path $ExePath) {
              Write-Host "✅ Build successful: $ExePath"
          } else {
              Write-Error "❌ Executable not found! Build failed?"
              exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q-Solver-Windows-amd64.exe
          path: build/bin/Q-Solver.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Q-Solver-Windows-amd64.exe
          path: artifacts/

      - name: Prepare Release Files
        run: |
          cd artifacts
          mv Q-Solver.exe Q-Solver-Windows-amd64.exe
          ls -la

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Q-Solver-Windows-amd64.exe
          generate_release_notes: true
